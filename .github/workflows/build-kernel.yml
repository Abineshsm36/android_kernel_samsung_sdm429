name: Build ReSukiSU Kernel (gtowifi / SM-T295)

on:
  push:
    branches: [ main, lineage-* ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Integrate ReSukiSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: Enable ReSukiSU in config
        run: |
          DEFCONFIG="P81080_defconfig"
          echo "CONFIG_KSU=y" >> arch/arm64/configs/$DEFCONFIG
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/$DEFCONFIG
          echo "[+] ReSukiSU config enabled"

      - name: Setup build environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential ccache curl flex git libncurses5-dev libssl-dev libelf-dev lzop zip

      - name: Download Toolchain (Robust method)
        run: |
          echo "Downloading Android 4.9 toolchain..."
          mkdir -p toolchain
          cd toolchain
          
          # Try multiple known good sources
          wget -q https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9/archive/refs/heads/lineage-19.1.tar.gz -O toolchain.tar.gz || \
          wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz -O toolchain.tar.gz
          
          echo "Extracting..."
          tar -xzf toolchain.tar.gz 2>/dev/null || tar --strip-components=1 -xzf toolchain.tar.gz 2>/dev/null || true
          
          echo "=== Searching for compiler ==="
          find . -name "aarch64-linux-android-gcc" 2>/dev/null | head -5 || echo "Not found with find"
          ls -la bin/ 2>/dev/null || echo "No bin folder"

      - name: Build kernel
        run: |
          export ARCH=arm64
          
          # Find the compiler dynamically
          COMPILER_PATH=$(find toolchain -name "aarch64-linux-android-gcc" 2>/dev/null | head -1)
          
          if [ -z "$COMPILER_PATH" ]; then
            echo "ERROR: Compiler binary still not found!"
            find toolchain -type f -name "*gcc*" | head -10
            exit 1
          fi
          
          export CROSS_COMPILE=$(dirname "$COMPILER_PATH")/aarch64-linux-android-
          echo "Found compiler at: $COMPILER_PATH"
          echo "Using CROSS_COMPILE=$CROSS_COMPILE"
          
          export CROSS_COMPILE_ARM32=toolchain/bin/arm-linux-androideabi-
          
          make -j$(nproc) P81080_defconfig
          make -j$(nproc)

      - name: Package as AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp arch/arm64/boot/Image.gz-dtb AnyKernel3/ || cp arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          zip -r9 ../ReSukiSU_gtowifi_$(date +%Y%m%d).zip *
          cd ..

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: ReSukiSU-Kernel
          path: ReSukiSU_gtowifi_*.zip
