name: Build ReSukiSU Kernel (gtowifi / SM-T295)

on:
  push:
    branches: [ main, lineage-* ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Integrate ReSukiSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: Enable ReSukiSU in config
        run: |
          DEFCONFIG="P81080_defconfig"
          echo "CONFIG_KSU=y" >> arch/arm64/configs/$DEFCONFIG
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/$DEFCONFIG
          echo "[+] ReSukiSU config enabled"

      - name: Setup build environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential ccache curl flex git libncurses5-dev libssl-dev libelf-dev lzop zip

      - name: Download Android 4.9 Toolchain (with debug)
        run: |
          echo "=== Downloading toolchain ==="
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 toolchain
          
          echo "=== Toolchain structure ==="
          ls -la toolchain/
          echo ""
          find toolchain -type f -name "*gcc*" | head -10 || echo "No gcc found"
          echo ""
          find toolchain -type d | head -15 || echo "No dirs found"

      - name: Build kernel
        run: |
          export ARCH=arm64
          
          # Auto-detect compiler path
          if [ -f "toolchain/bin/aarch64-linux-android-gcc" ]; then
            CROSS_COMPILE="toolchain/bin/aarch64-linux-android-"
          elif [ -f "toolchain/aarch64-linux-android-4.9/bin/aarch64-linux-android-gcc" ]; then
            CROSS_COMPILE="toolchain/aarch64-linux-android-4.9/bin/aarch64-linux-android-"
          else
            echo "ERROR: Compiler not found in expected paths!"
            find toolchain -name "aarch64-linux-android-gcc" 2>/dev/null || echo "Still not found"
            exit 1
          fi
          
          echo "Using CROSS_COMPILE=$CROSS_COMPILE"
          export CROSS_COMPILE=$CROSS_COMPILE
          export CROSS_COMPILE_ARM32=toolchain/bin/arm-linux-androideabi-
          
          make -j$(nproc) P81080_defconfig
          make -j$(nproc)

      - name: Package as AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp arch/arm64/boot/Image.gz-dtb AnyKernel3/ || cp arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          zip -r9 ../ReSukiSU_gtowifi_$(date +%Y%m%d).zip *
          cd ..

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: ReSukiSU-Kernel
          path: ReSukiSU_gtowifi_*.zip
