name: Build KernelSU Kernel for gtowifi (SM-T290/T295)

on:
  workflow_dispatch:       # Manual trigger from GitHub Actions tab
    inputs:
      KSU_VERSION:
        description: 'KernelSU version tag (e.g. v0.9.5) or leave blank for latest'
        required: false
        default: ''
      BUILD_TYPE:
        description: 'Build type'
        required: true
        default: 'kernelsu'
        type: choice
        options:
          - kernelsu        # With KernelSU root
          - vanilla         # Without KernelSU (stock kernel)

  push:
    branches:
      - main               # Also auto-build on every push to main branch
    paths:
      - 'kernel/**'        # Only trigger if kernel files changed

env:
  # ── Kernel source ──────────────────────────────────────────────────────────
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_samsung_sdm429
  KERNEL_BRANCH: lineage-22.2        # Change to lineage-21 etc if needed
  KERNEL_DEFCONFIG: gtowifi_defconfig

  # ── Toolchain ──────────────────────────────────────────────────────────────
  CLANG_VERSION: clang-r487747c      # Tested with kernel 4.9
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  CLANG_TRIPLE: aarch64-linux-gnu-

  # ── Output ─────────────────────────────────────────────────────────────────
  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3
  ANYKERNEL_BRANCH: master

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120             # Kill job if it takes more than 2 hours

    steps:
      # ── 1. Show build info ──────────────────────────────────────────────────
      - name: Print build info
        run: |
          echo "==============================="
          echo " KernelSU Kernel Build"
          echo " Device  : SM-T290 / SM-T295 (gtowifi)"
          echo " SoC     : Snapdragon 429 (SDM429)"
          echo " Kernel  : 4.9 (linux kernel)"
          echo " Build   : ${{ github.event.inputs.BUILD_TYPE || 'kernelsu' }}"
          echo " Runner  : $(uname -r)"
          echo " Date    : $(date)"
          echo "==============================="

      # ── 2. Install dependencies ─────────────────────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git curl wget make bc bison flex \
            libssl-dev libelf-dev \
            gcc gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            python3 zip unzip \
            ccache lld llvm \
            libncurses-dev \
            cpio kmod

      # ── 3. Setup ccache (speeds up rebuilds significantly) ──────────────────
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 2G
          key: gtowifi-kernel-${{ github.sha }}
          restore-keys: gtowifi-kernel-

      # ── 4. Clone kernel source ──────────────────────────────────────────────
      - name: Clone kernel source
        run: |
          echo "Cloning kernel source..."
          git clone --depth=1 \
            --branch ${{ env.KERNEL_BRANCH }} \
            ${{ env.KERNEL_REPO }} \
            kernel
          echo "Kernel source cloned successfully."
          echo "Kernel version: $(cat kernel/Makefile | grep -E '^VERSION|^PATCHLEVEL|^SUBLEVEL' | head -3)"

      # ── 5. Apply KernelSU (only if build type is kernelsu) ──────────────────
      - name: Apply KernelSU patch
        if: ${{ github.event.inputs.BUILD_TYPE != 'vanilla' }}
        working-directory: kernel
        run: |
          echo "Applying KernelSU..."

          # Use specific version if provided, else use latest
          KSU_VER="${{ github.event.inputs.KSU_VERSION }}"
          if [ -z "$KSU_VER" ]; then
            echo "No version specified, using latest KernelSU..."
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          else
            echo "Using KernelSU version: $KSU_VER"
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s "$KSU_VER"
          fi

          # Verify KernelSU was applied
          if [ -d "drivers/kernelsu" ]; then
            echo "✅ KernelSU applied successfully"
            KSU_VER_FILE="drivers/kernelsu/ksu.h"
            if [ -f "$KSU_VER_FILE" ]; then
              echo "KSU version info: $(grep 'KSU_VERSION' $KSU_VER_FILE | head -1)"
            fi
          else
            echo "❌ KernelSU setup script failed, trying manual method..."

            # Manual fallback for kernel 4.9
            git submodule add https://github.com/tiann/KernelSU drivers/kernelsu || true

            # Add to Makefile
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile

            # Add to Kconfig (before last endmenu)
            sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

            echo "Manual KernelSU hooks applied."
          fi

      # ── 6. Apply manual hooks for kernel 4.9 (non-GKI) ─────────────────────
      - name: Apply manual kernel hooks for 4.9
        if: ${{ github.event.inputs.BUILD_TYPE != 'vanilla' }}
        working-directory: kernel
        run: |
          echo "Checking if manual hooks are needed for kernel 4.9..."

          # Check if KPROBES is available - if not, we need manual hooks
          if ! grep -q "CONFIG_KPROBES" arch/arm64/configs/${{ env.KERNEL_DEFCONFIG }} 2>/dev/null; then
            echo "KPROBES not available, applying manual hooks..."

            # --- Hook 1: fs/exec.c ---
            if ! grep -q "ksu_handle_execveat" fs/exec.c; then
              # Add extern declaration after includes
              sed -i '/^#include <linux\/binfmts.h>/a #ifdef CONFIG_KSU\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n#endif' fs/exec.c

              # Add call inside do_execveat_common
              sed -i '/retval = bprm_mm_init(bprm);/i \#ifdef CONFIG_KSU\n\tksu_handle_execveat(\&fd, \&filename, argv, envp, \&flags);\n#endif' fs/exec.c
              echo "✅ exec.c hook applied"
            else
              echo "exec.c hook already present"
            fi

            # --- Hook 2: fs/open.c ---
            if ! grep -q "ksu_handle_faccessat" fs/open.c; then
              sed -i '/^SYSCALL_DEFINE3(faccessat/i #ifdef CONFIG_KSU\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n#endif' fs/open.c
              sed -i '/audit_syscall_entry/i \#ifdef CONFIG_KSU\n\tksu_handle_faccessat(\&dfd, \&filename, \&mode, NULL);\n#endif' fs/open.c
              echo "✅ open.c hook applied"
            else
              echo "open.c hook already present"
            fi

            # --- Hook 3: drivers/input/input.c ---
            if ! grep -q "ksu_handle_input_handle_event" drivers/input/input.c; then
              sed -i '/^static void input_handle_event/a #ifdef CONFIG_KSU\nextern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);\n#endif' drivers/input/input.c
              sed -i '/disposition = input_get_disposition/i \#ifdef CONFIG_KSU\n\tksu_handle_input_handle_event(\&type, \&code, \&value);\n#endif' drivers/input/input.c
              echo "✅ input.c hook applied"
            else
              echo "input.c hook already present"
            fi

          else
            echo "KPROBES available, manual hooks not needed"
          fi

      # ── 7. Configure defconfig ──────────────────────────────────────────────
      - name: Configure kernel
        working-directory: kernel
        run: |
          export ARCH=${{ env.ARCH }}
          export CROSS_COMPILE=${{ env.CROSS_COMPILE }}

          # Enable KernelSU in config if building with KSU
          BUILD_TYPE="${{ github.event.inputs.BUILD_TYPE || 'kernelsu' }}"
          if [ "$BUILD_TYPE" = "kernelsu" ]; then
            echo "CONFIG_KSU=y" >> arch/arm64/configs/${{ env.KERNEL_DEFCONFIG }}
            echo "Enabled CONFIG_KSU in defconfig"
          fi

          # Generate .config from defconfig
          make ARCH=${{ env.ARCH }} \
               CROSS_COMPILE=${{ env.CROSS_COMPILE }} \
               ${{ env.KERNEL_DEFCONFIG }}

          echo "✅ Kernel configured"

      # ── 8. Build the kernel ─────────────────────────────────────────────────
      - name: Build kernel
        working-directory: kernel
        run: |
          export ARCH=${{ env.ARCH }}
          export CROSS_COMPILE=${{ env.CROSS_COMPILE }}
          export PATH="/usr/lib/ccache:$PATH"

          echo "Starting kernel build..."
          echo "Using $(nproc) CPU cores"

          make ARCH=${{ env.ARCH }} \
               CROSS_COMPILE=${{ env.CROSS_COMPILE }} \
               CC="ccache aarch64-linux-gnu-gcc" \
               -j$(nproc) \
               2>&1 | tee ../build.log

          # Check if Image.gz-dtb was produced
          if [ -f "arch/arm64/boot/Image.gz-dtb" ]; then
            echo "✅ Kernel built successfully!"
            ls -lh arch/arm64/boot/Image.gz-dtb
          elif [ -f "arch/arm64/boot/Image.gz" ]; then
            echo "✅ Kernel Image.gz built (no dtb merged)"
            ls -lh arch/arm64/boot/Image.gz
          else
            echo "❌ Build failed! Kernel image not found."
            echo "Last 50 lines of build log:"
            tail -50 ../build.log
            exit 1
          fi

      # ── 9. Package with AnyKernel3 ──────────────────────────────────────────
      - name: Package with AnyKernel3
        run: |
          echo "Packaging kernel with AnyKernel3..."

          git clone --depth=1 \
            --branch ${{ env.ANYKERNEL_BRANCH }} \
            ${{ env.ANYKERNEL_REPO }} \
            AnyKernel3

          # Copy kernel image
          if [ -f "kernel/arch/arm64/boot/Image.gz-dtb" ]; then
            cp kernel/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          else
            cp kernel/arch/arm64/boot/Image.gz AnyKernel3/
          fi

          # Edit AnyKernel3 config for our device
          cat > AnyKernel3/anykernel.sh << 'EOF'
          # AnyKernel3 config for SM-T290/T295 (gtowifi)
          properties() { '
          kernel.string=KernelSU Kernel for gtowifi by GitHub Actions
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=gtowifi
          device.name2=SM-T290
          device.name3=SM-T295
          supported.versions=
          supported.patchlevels=
          '; }

          block=/dev/block/platform/soc/7824900.sdhci/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;

          . tools/ak3-core.sh;
          . split_img;
          . repack_ramdisk;
          . flash_kernel;
          EOF

          # Create flashable zip
          BUILD_TYPE="${{ github.event.inputs.BUILD_TYPE || 'kernelsu' }}"
          ZIP_NAME="gtowifi-kernel-${BUILD_TYPE}-$(date +%Y%m%d-%H%M).zip"

          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" . -x ".git/*" -x "*.md"
          cd ..

          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "✅ Packaged: $ZIP_NAME"
          ls -lh "$ZIP_NAME"

      # ── 10. Upload artifacts ────────────────────────────────────────────────
      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 7         # Keep for 7 days then auto-delete

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()                # Upload log even if build failed
        with:
          name: build-log-${{ github.run_id }}
          path: build.log
          retention-days: 3

      # ── 11. Print summary ───────────────────────────────────────────────────
      - name: Build summary
        if: success()
        run: |
          echo "==============================="
          echo " ✅ BUILD SUCCESSFUL"
          echo "==============================="
          echo " Device  : SM-T290 / SM-T295"
          echo " Type    : ${{ github.event.inputs.BUILD_TYPE || 'kernelsu' }}"
          echo " Output  : ${{ env.ZIP_NAME }}"
          echo ""
          echo " Download from:"
          echo " GitHub → Actions → This run → Artifacts"
          echo "==============================="
