name: Build ReSukiSU Kernel (gtowifi / SM-T295)

on:
  push:
    branches: [ main, lineage-* ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Integrate ReSukiSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: Enable ReSukiSU in config
        run: |
          DEFCONFIG="P81080_defconfig"
          echo "CONFIG_KSU=y" >> arch/arm64/configs/$DEFCONFIG
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/$DEFCONFIG
          echo "[+] ReSukiSU config enabled"

      - name: Setup build environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential ccache curl flex git libncurses5-dev libssl-dev libelf-dev lzop zip

      - name: Download Android 4.9 Toolchain (Tarball)
        run: |
          echo "Downloading toolchain tarball..."
          mkdir -p toolchain
          cd toolchain
          
          # Reliable direct tarball (commonly used for 4.9 kernels)
          wget -q --show-progress https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz -O toolchain.tar.gz
          
          echo "Extracting..."
          tar -xzf toolchain.tar.gz --strip-components=0
          
          echo "=== Toolchain contents ==="
          ls -la bin/ 2>/dev/null || ls -la
          find . -name "aarch64-linux-android-gcc" 2>/dev/null | head -3 || echo "Still searching..."

      - name: Build kernel
        run: |
          export ARCH=arm64
          
          if [ -f "toolchain/bin/aarch64-linux-android-gcc" ]; then
            export CROSS_COMPILE=toolchain/bin/aarch64-linux-android-
          else
            echo "ERROR: Compiler binary not found after extraction!"
            find toolchain -name "*gcc*" | head -10
            exit 1
          fi
          
          echo "Using CROSS_COMPILE=$CROSS_COMPILE"
          export CROSS_COMPILE_ARM32=toolchain/bin/arm-linux-androideabi-
          
          make -j$(nproc) P81080_defconfig
          make -j$(nproc)

      - name: Package as AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp arch/arm64/boot/Image.gz-dtb AnyKernel3/ || cp arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          zip -r9 ../ReSukiSU_gtowifi_$(date +%Y%m%d).zip *
          cd ..

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: ReSukiSU-Kernel
          path: ReSukiSU_gtowifi_*.zip
