name: Build Android Kernel (gtowifi)

on:
  workflow_dispatch: # Allows you to manually click "Run workflow" from the Actions tab

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Toolchains and Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev flex bison libelf-dev git lz4 liblz4-tool \
                                 crossbuild-essential-arm64 gcc-arm-linux-gnueabi

      - name: Patch Build Errors via sed
        run: |
          echo "=== Patching Prima Wi-Fi Driver flags for GCC compliance ==="
          if [ -f drivers/staging/prima/Makefile ]; then
            sed -i 's/-Wno-non-literal-null-conversion//g' drivers/staging/prima/Makefile
            sed -i 's/-Wno-typedef-redefinition//g' drivers/staging/prima/Makefile
            echo "Successfully clean-patched drivers/staging/prima/Makefile"
          else
            echo "Warning: drivers/staging/prima/Makefile not found!"
          fi

      - name: Configure and Compile Kernel
        run: |
          # Set architecture targets
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Assign the correct 64-bit and 32-bit GCC toolchain prefixes
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Setup output directory
          mkdir -p out
          
          echo "=== Generating configuration from lineageos_gtowifi_defconfig ==="
          make O=out lineageos_gtowifi_defconfig
          
          echo "=== Starting compilation ==="
          make -j$(nproc) O=out

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-gtowifi-build
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
