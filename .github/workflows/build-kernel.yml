name: Build T295 Kernel
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            gcc-arm-linux-gnueabi \
            build-essential git zip
      - name: Configure kernel
        run: |
          make O=out ARCH=arm sdm429-bg_defconfig
      - name: Build kernel
        run: |
          make O=out ARCH=arm -j$(nproc) \
            CROSS_COMPILE=arm-linux-gnueabi- 2>&1 | tee build.log
      - name: Upload build log (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-output
          path: |
            out/arch/arm/boot/zImage
            out/arch/arm/boot/zImage-dtb
            out/arch/arm/boot/Image.gz-dtb
            out/.config
          if-no-files-found: warn
