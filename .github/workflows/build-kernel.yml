name: Build SM-T295 Kernel

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-22.04

```
steps:
  - uses: actions/checkout@v4

  - name: Install Dependencies
    run: |
      sudo apt update
      sudo apt install -y \
        git bc bison flex build-essential \
        clang lld llvm \
        libssl-dev libelf-dev python3

  - name: Configure Kernel
    run: |
      export ARCH=arm64
      make O=out lineageos_gtowifi_defconfig

  - name: Build Kernel
    run: |
      export ARCH=arm64
      export SUBARCH=arm64

      make O=out -j$(nproc) \
        CC=clang \
        LLVM=1 \
        LLVM_IAS=1

  - name: Upload Artifact
    uses: actions/upload-artifact@v4
    with:
      name: kernel
      path: out
```
