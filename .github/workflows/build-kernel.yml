name: Build ReSukiSU Kernel for gtowifi

on:
  push:
    branches: [ main, lineage-22* ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Integrate ReSukiSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: Show what was done
        run: |
          ls -la drivers/kernelsu || echo "Symlink check"
          echo "=== drivers/Makefile (last 10 lines) ==="
          tail -10 drivers/Makefile
