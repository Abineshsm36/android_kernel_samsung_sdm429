name: Build SM-T295 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git bc bison flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            python3 \
            python-is-python3 \
            curl zip unzip

      - name: Clone Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Show Available Defconfigs
        run: |
          find arch/arm64/configs -type f | sort

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$PWD/clang/bin:$PATH

          mkdir -p out

          # CHANGE THIS AFTER CHECKING LOGS
          make O=out vendor/gta_defconfig

          make O=out -j$(nproc) \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Upload Build Output
        uses: actions/upload-artifact@v4
        with:
          name: kernel-output
          path: out
