name: Build Android Kernel (gtowifi)

on:
  workflow_dispatch: # Allows you to manually click "Run workflow" from the Actions tab

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev flex bison libelf-dev git lz4 liblz4-tool

      - name: Download Proton Clang Toolchain
        run: |
          echo "=== Downloading Proton Clang (All-in-One Toolchain) ==="
          # Performs a shallow clone to save time and space
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git tc
          # Dynamically adds the toolchain's binaries path to the GitHub runner environment
          echo "$GITHUB_WORKSPACE/tc/bin" >> $GITHUB_PATH

      - name: Patch Build Errors via sed
        run: |
          echo "=== Patching Prima Wi-Fi Driver flags just in case ==="
          if [ -f drivers/staging/prima/Makefile ]; then
            sed -i 's/-Wno-non-literal-null-conversion//g' drivers/staging/prima/Makefile
            sed -i 's/-Wno-typedef-redefinition//g' drivers/staging/prima/Makefile
            echo "Successfully clean-patched drivers/staging/prima/Makefile"
          else
            echo "Prima Makefile not found, skipping."
          fi

      - name: Configure and Compile Kernel
        run: |
          # Set architecture targets
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Set Proton Clang environment variables
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Setup output directory
          mkdir -p out
          
          echo "=== Generating configuration from lineageos_gtowifi_defconfig ==="
          make O=out lineageos_gtowifi_defconfig
          
          echo "=== Starting compilation ==="
          make -j$(nproc) O=out

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-gtowifi-build
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
