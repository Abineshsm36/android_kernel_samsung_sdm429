name: Build T295 Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            build-essential git zip

      # STEP 1: Run this first to find your real defconfig name.
      # Open the Actions log for this step and look for a file
      # matching your device (e.g. something with "gto" in the name).
      - name: List available defconfigs (debug)
        run: |
          echo "---- arch/arm64/configs ----"
          ls arch/arm64/configs/ 2>/dev/null || echo "(no arm64 configs dir)"
          echo "---- arch/arm/configs ----"
          ls arch/arm/configs/ 2>/dev/null || echo "(no arm configs dir)"

      # STEP 2: Once you've confirmed the name above, replace
      # gto_defconfig below with the exact filename (minus .h if any).
      - name: Configure kernel
        env:
          DEFCONFIG: sdm429-bg_defconfig
        run: |
          make O=out ARCH=arm64 ${sdm429-bg_defconfig}

      - name: Build kernel
        run: |
          make O=out ARCH=arm64 -j$(nproc) \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- 2>&1 | tee build.log

      - name: Upload build log (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-output
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image
            out/.config
          if-no-files-found: warn
