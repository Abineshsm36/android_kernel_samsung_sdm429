name: Build ReSukiSU Kernel (Simple)

on:
  push:
    branches: [ main, lineage-* ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
      options: --privileged

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4

      - name: Integrate ReSukiSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: Enable ReSukiSU
        run: |
          echo "CONFIG_KSU=y" >> arch/arm64/configs/P81080_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/P81080_defconfig

      - name: Setup environment
        run: |
          apt-get update
          apt-get install -y bc bison build-essential ccache curl flex git libncurses5-dev libssl-dev wget

      - name: Download Toolchain
        run: |
          mkdir -p toolchain
          cd toolchain
          wget -q https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9/archive/refs/heads/lineage-19.1.tar.gz -O tc.tar.gz
          tar -xzf tc.tar.gz
          ls -la */bin/ | head -5

      - name: Build kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=$(pwd)/toolchain/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9-lineage-19.1/bin/aarch64-linux-android-
          
          make -j$(nproc) P81080_defconfig
          make -j$(nproc)

      - name: Package
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp arch/arm64/boot/Image.gz-dtb AnyKernel3/ || true
          cd AnyKernel3 && zip -r9 ../ReSukiSU_kernel.zip * && cd ..

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel
          path: ReSukiSU_kernel.zip
