name: Build SM-T295 Kernel

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-22.04

```
steps:
  - name: Checkout Kernel Source
    uses: actions/checkout@v4

  - name: Install Dependencies
    run: |
      sudo apt update
      sudo apt install -y \
        git bc bison flex \
        build-essential \
        curl zip unzip \
        libssl-dev \
        libelf-dev \
        python3

  - name: Clone Neutron Clang
    run: |
      git clone --depth=1 https://github.com/Neutron-Toolchains/clang clang

  - name: Configure Kernel
    run: |
      export ARCH=arm64
      make O=out lineageos_gtowifi_defconfig

  - name: Build Kernel
    run: |
      export ARCH=arm64
      export SUBARCH=arm64
      export PATH=$PWD/clang/bin:$PATH

      make O=out -j$(nproc) \
        CC=clang \
        LLVM=1 \
        LLVM_IAS=1 \
        LD=ld.lld

  - name: Upload Kernel
    uses: actions/upload-artifact@v4
    with:
      name: SM-T295-Kernel
      path: |
        out/arch/arm64/boot/Image*
        out/arch/arm64/boot/dts/
```
